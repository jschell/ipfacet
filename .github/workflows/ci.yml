name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: "0.12.19"
      - name: Set up Python
        run: uv python install ${{ matrix.python }}
      - name: Sync locked environment
        run: uv sync --frozen --dev --python ${{ matrix.python }}
      - name: Check lockfile
        run: uv lock --check
      - name: Ruff lint
        run: uv run --frozen ruff check .
      - name: Ruff format
        run: uv run --frozen ruff format --check .
      - name: Pyright
        run: uv run --frozen pyright
      - name: Tests
        run: uv run --frozen pytest
      - name: Build
        run: uv build
      - name: Install built wheel in clean environment
        run: uv run --frozen python scripts/smoke_wheel.py
      - name: Install optional DataFrame extras independently
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run --frozen python scripts/smoke_wheel.py --extras
