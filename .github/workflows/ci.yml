name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: "0.12.19"
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync locked environment
        run: uv sync --frozen --dev
      - name: Check lockfile
        run: uv lock --check
      - name: Ruff lint
        run: uv run --frozen ruff check .
      - name: Ruff format
        run: |
          uv run --frozen ruff format src/ipfacet/providers/ipinfo_lite.py tests/test_ipinfo_lite.py
          git diff -- src/ipfacet/providers/ipinfo_lite.py tests/test_ipinfo_lite.py
          exit 1
      - name: Pyright
        run: uv run --frozen pyright
      - name: Tests
        run: uv run --frozen pytest
      - name: Build
        run: uv build
