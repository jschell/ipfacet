[project]
name = "ipfacet"
version = "1.0.0rc1"
description = "Provider-neutral offline IP address enrichment with provenance"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "IPFacet contributors" }]
keywords = ["ip", "asn", "network", "enrichment", "offline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
ipfacet = "ipfacet.cli:main"

[project.optional-dependencies]
polars = [
    "polars>=1.0,<2",
]
pandas = [
    "pandas>=2.2,<4",
]
arrow = [
    "pyarrow>=18,<27",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pandas>=2.2,<4",
  "pandas-stubs>=3.0.5.260914",
  "polars>=1.0,<2",
  "pyarrow>=18,<27",
  "pyarrow-stubs>=20.0.0.20260819",
  "pyright>=1.1.405,<2",
  "pytest>=8.4,<9",
  "ruff>=0.13,<0.14",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
